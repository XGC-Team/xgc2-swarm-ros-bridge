schema: xgc2.product.v1
id: xgc2-swarm-ros-bridge
name: XGC2 Swarm ROS Bridge
version: 1.1.0-9
kind: ros1-apt
summary: ROS Melodic and Noetic ZeroMQ bridge for selected swarm robot topics.
groups:
- ros1
- communication
- swarm
ros:
  distro: melodic,noetic
  packages:
  - swarm_ros_bridge
apt:
  distribution: bionic,focal
  install:
  - ros-melodic-swarm-ros-bridge
  - ros-noetic-swarm-ros-bridge
  package_distributions:
    ros-melodic-swarm-ros-bridge:
    - bionic
    ros-noetic-swarm-ros-bridge:
    - focal
  packages:
  - ros-melodic-swarm-ros-bridge
  - ros-noetic-swarm-ros-bridge
  depends:
  - libzmqpp-dev
  - ros-melodic-geometry-msgs
  - ros-melodic-nav-msgs
  - ros-melodic-roscpp
  - ros-melodic-scout-msgs
  - ros-melodic-sensor-msgs
  - ros-melodic-std-msgs
  - ros-noetic-geometry-msgs
  - ros-noetic-nav-msgs
  - ros-noetic-roscpp
  - ros-noetic-scout-msgs
  - ros-noetic-sensor-msgs
  - ros-noetic-std-msgs
usage:
  install: 'sudo apt update

    sudo apt install ros-melodic-swarm-ros-bridge

    sudo apt install ros-noetic-swarm-ros-bridge

    '
  smoke_test: 'rospack find swarm_ros_bridge

    roslaunch --files swarm_ros_bridge test.launch

    '
  notes: 'This package is the generic bridge binary. Robot-specific topic and peer

    configuration should live in the consuming robot product, not in this

    package. The legacy compiled message set is sensor_msgs/Imu,

    geometry_msgs/Twist, and std_msgs/String. The additive ROS-free v2 library

    freezes closed ground/vehicle capabilities and per-channel bounded ACK

    windows. Its separate ROS1 codec has a closed telemetry allowlist of

    sensor_msgs/Imu, nav_msgs/Odometry, and scout_msgs/ScoutStatus and can only

    construct a positive-zero Twist from an admitted ZERO_STOP. Neither v2

    library is wired to sockets, ROS runtime topics, or robot drivers.

    '
ownership:
  paths:
  - /opt/ros/melodic/share/swarm_ros_bridge
  - /opt/ros/melodic/lib/swarm_ros_bridge/bridge_node
  - /opt/ros/melodic/lib/libswarm_ros_bridge_protocol_v2.so
  - /opt/ros/melodic/lib/libswarm_ros_bridge_ros1_codec_v2.so
  - /opt/ros/melodic/include/swarm_ros_bridge/v2/protocol.hpp
  - /opt/ros/melodic/include/swarm_ros_bridge/v2/ros1_codec.hpp
  - /opt/ros/melodic/share/swarm_ros_bridge/docs/protocol-v2.md
  - /opt/ros/melodic/lib/swarm_ros_bridge/tests/swarm_ros_bridge_v2_protocol_test
  - /opt/ros/melodic/lib/swarm_ros_bridge/tests/swarm_ros_bridge_v2_ros1_codec_test
  - /opt/ros/noetic/share/swarm_ros_bridge
  - /opt/ros/noetic/lib/swarm_ros_bridge/bridge_node
  - /opt/ros/noetic/lib/libswarm_ros_bridge_protocol_v2.so
  - /opt/ros/noetic/lib/libswarm_ros_bridge_ros1_codec_v2.so
  - /opt/ros/noetic/include/swarm_ros_bridge/v2/protocol.hpp
  - /opt/ros/noetic/include/swarm_ros_bridge/v2/ros1_codec.hpp
  - /opt/ros/noetic/share/swarm_ros_bridge/docs/protocol-v2.md
  - /opt/ros/noetic/lib/swarm_ros_bridge/tests/swarm_ros_bridge_v2_protocol_test
  - /opt/ros/noetic/lib/swarm_ros_bridge/tests/swarm_ros_bridge_v2_ros1_codec_test
release:
  workflow: release.yml
  dependency_policy:
    xgc2-scout-msgs: rebuild
  apt_versions:
    bionic: 1.1.0-9
    focal: 1.1.0-9
