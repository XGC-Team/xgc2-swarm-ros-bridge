schema: xgc2.product.v1
id: xgc2-swarm-ros-bridge
name: XGC2 Swarm ROS Bridge
version: 1.1.0-15
kind: ros1-apt
summary: ROS Melodic and Noetic ZeroMQ bridge for selected swarm robot topics.
groups:
- ros1
- communication
- swarm
ros:
  distro: melodic,noetic
  packages:
  - swarm_ros_bridge
apt:
  distribution: bionic,focal
  install:
  - ros-melodic-swarm-ros-bridge
  - ros-noetic-swarm-ros-bridge
  package_distributions:
    ros-melodic-swarm-ros-bridge:
    - bionic
    ros-noetic-swarm-ros-bridge:
    - focal
  packages:
  - ros-melodic-swarm-ros-bridge
  - ros-noetic-swarm-ros-bridge
  depends:
  - libzmqpp4
  - ros-melodic-geometry-msgs
  - ros-melodic-roscpp
  - ros-melodic-sensor-msgs
  - ros-melodic-std-msgs
  - ros-noetic-geometry-msgs
  - ros-noetic-roscpp
  - ros-noetic-sensor-msgs
  - ros-noetic-std-msgs
  - ros-melodic-nav-msgs
  - ros-melodic-mavros-msgs
  - ros-melodic-rosgraph-msgs
  - ros-noetic-nav-msgs
  - ros-noetic-mavros-msgs
  - ros-noetic-rosgraph-msgs
usage:
  install: |
    sudo apt update
    sudo apt install ros-melodic-swarm-ros-bridge
    sudo apt install ros-noetic-swarm-ros-bridge
  smoke_test: |
    rospack find swarm_ros_bridge
    roslaunch --files swarm_ros_bridge test.launch
  notes: |
    Generic ZeroMQ bridge_node. Robot-specific topic and peer YAML lives in
    the consuming robot product. Compiled messages: sensor_msgs/Imu,
    geometry_msgs/Twist, std_msgs/String, std_msgs/Float32, std_msgs/UInt32,
    geometry_msgs/PoseStamped, geometry_msgs/TwistStamped, nav_msgs/Path,
    mavros_msgs/State, mavros_msgs/ExtendedState and rosgraph_msgs/Clock.
    bridge.launch takes an explicit configuration argument; it does not discover
    the ROS graph or infer experiment mode.
ownership:
  paths:
  - /opt/ros/melodic/share/swarm_ros_bridge
  - /opt/ros/melodic/lib/swarm_ros_bridge/bridge_node
  - /opt/ros/noetic/share/swarm_ros_bridge
  - /opt/ros/noetic/lib/swarm_ros_bridge/bridge_node
release:
  workflow: release.yml
  apt_versions:
    bionic: 1.1.0-14
    focal: 1.1.0-14
